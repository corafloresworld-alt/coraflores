<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Le Point de Départ | Cora Flores</title>

  <!-- Polices -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700&family=Francois+One&display=swap"
    rel="stylesheet"
  >

  <style>

    /* ======================
       BASE
    ====================== */

    :root {
      --green: #334434;
      --gold: #CF9F40;
      --cream: #F4F0E8;
      --text: #334434;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
    }


/* ======================
   NAVBAR
====================== */

.navbar {
  position: relative;

  width: 100%;
  height: 100px;

  z-index: 9999;

  background: #334434;

  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.navbar-inner {
  max-width: 1300px;
  height: 100%;

  margin: 0 auto;
  padding: 10px 1.8rem 0;

  display: flex;
  align-items: center;
  gap: 2rem;
}


.navbar-links a.active {
  text-decoration: underline;
  text-underline-offset: 6px;
  text-decoration-thickness: 1px;
}

/* Logo */

.navbar-logo img {
  height: 85px;
  width: auto;
  display: block;

  transform: translateY(2px);
}

/* Espace central */

.navbar-info {
  flex: 1;
  overflow: hidden;

  display: flex;
  align-items: center;
}

/* Liens */

.navbar-links {
  display: flex;
  align-items: center;
  gap: 2rem;
}

.navbar-links a {
  color: #ffffff;
  text-decoration: none;

  font-size: 0.95rem;
  font-weight: 500;

  transition: opacity 0.2s ease;
}

.navbar-links a:hover {
  opacity: 0.65;
}


/* ======================
   PAGE HEADER
====================== */

.point-header {
  position: relative;

  min-height: 620px;

  display: flex;
  align-items: center;

  background-image:
    linear-gradient(
      90deg,
      rgba(51, 68, 52, 0.88) 0%,
      rgba(51, 68, 52, 0.72) 45%,
      rgba(51, 68, 52, 0.30) 100%
    ),
    url('/assets/images/pointdedepart-fond.png');

  background-size: cover;
  background-position: center;

  color: #ffffff;
}

.point-header-content {
  width: 100%;
  max-width: 1300px;

  margin: 0 auto;
  padding: 80px 8% 100px;
}

.point-header .image-caption {
  display: inline-block;

  color: var(--gold);

  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;

  margin-bottom: 1.5rem;
}

.point-header h1 {
  max-width: 850px;

  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(3rem, 5.2vw, 5.8rem);
  font-weight: 400;
  line-height: 0.98;

  margin: 0 0 1.8rem;
}

.point-header h1 em {
  font-style: italic;
  font-weight: 400;
  color: var(--gold);
}

.point-header .header-subtitle {
  max-width: 620px;

  font-size: 1.15rem;
  font-weight: 400;
  line-height: 1.65;

  color: rgba(255, 255, 255, 0.88);
}

    
  </style>

</head>


<body>

  <!-- NAVBAR -->

  <header class="navbar">

    <div class="navbar-inner">

      <!-- LOGO -->

      <a href="/" class="navbar-logo">
        <img
          src="/assets/images/sign_blanc3.png"
          alt="Cora Flores"
        >
      </a>


      <!-- ESPACE CENTRAL -->

      <div class="navbar-info"></div>


      <!-- LIENS -->

      <nav class="navbar-links">

        <a href="/apropos/">À propos</a>

        <a href="/#point-depart" class="active">Le Point de Départ</a>
        
        <a href="/#bascule">La Bascule</a>

        <a href="/contact/">Contact</a>

      </nav>

    </div>

  </header>


  <!-- CONTENU DE LA PAGE -->

  <main>

  <section class="point-header">

  <div class="point-header-content">

    <span class="image-caption">
      Le Point de Départ
    </span>

    <h1>
      Concrètement,<br>
      qu'est-ce qui se passe<br>
      quand on <em>commence</em> ?
    </h1>

    <p class="header-subtitle">
      Un parcours pensé pour prendre le temps de comprendre,
      clarifier et avancer, étape par étape.
    </p>

  </div>

</section>
  </main>


</body>

</html>
