<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parlons de votre projet</title>
  
<link rel="icon" type="image/png" href="/favicon/logo-fav-cf.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Francois+One&display=swap" rel="stylesheet">



  
  <style>

     /* ================================
     🎨 PALETTE DE COULEURS – SITE
     ================================ */
  :root {
    --color-bg-main: #334434;
    --color-bg-secondary: #021f5a;

    --color-text-main: #ffffff;
    --color-text-muted: #ffffff;

    --color-accent: #CF9F40;
    --color-accent-hover: #a72a50;

    --color-border: rgba(255,255,255,0.2);
  }

    *,
*::before,
*::after {
  box-sizing: border-box;
}


    @font-face {
      font-family: 'Euclid';
      src: url('../fonts/euclid.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    

    .navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 95px;
  background: rgba(20,20,20,.10);
  backdrop-filter: blur(18px);
  border-bottom:1px solid rgba(255,255,255,.08);
  z-index: 9999;
}

.navbar-inner {
  max-width: 1200px;
  height: 100%;
  margin: 0 auto;
  padding: 0 1.5rem;

  display: grid;
  grid-template-columns: auto 1fr auto; 
  align-items: center;
}

/* Logo */
.navbar-logo img {
  height: 70px;
  width: auto;
}

/* Texte promo */
.navbar-info {
  text-align: center;
  font-size: 0.9rem;
  color: white;
  opacity: 0.85;
}

/* Liens à droite */
.navbar-links {
  display: flex;
  gap: 3.5rem;
  margin-left: auto;
  align-items: center;
  flex-wrap: nowrap;
}

.navbar-links a {
  color: #ffffff;
  text-decoration: none;
  font-size: 15.5px;
  font-weight: 400;
  letter-spacing: 0.04em;
  transition: opacity 0.3s ease;
}

.navbar-links a:hover {
  opacity: 0.7;
}

.navbar-links a.active {
  text-decoration: underline;
  text-underline-offset: 6px;
  text-decoration-thickness: 1px;
}

.navbar-links .cta {
  background: none;
  padding: 0;
  border-radius: 0;
  font-weight: 400;
}

.navbar-links .cta:hover {
  background: var(--color-accent);
}

/* MOBILE */
@media (max-width: 768px) {
  .navbar-info {
    display: none;
  }

  .navbar-logo img {
    height: 52px;
  }
} 


body {
  font-family: 'Euclid', sans-serif;
  background-color: var(--color-bg-main);
  color: var(--color-text-main);

  margin: 0;
  min-height: 100vh;

  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 3rem 1rem 1rem 1rem;
  padding-top: 95px; /* 🔥 même valeur que les autres pages */
}


    h1 {
      color: var(--color-accent);
      margin-bottom: 1rem;
      text-align: center;
      font-weight: 700;
      font-size: 2.5rem;
    }


  form {
  background: rgba(255, 255, 255, 0.08); /* 🔥 fond clair translucide */
  backdrop-filter: blur(8px);             /* effet verre (si supporté) */
  -webkit-backdrop-filter: blur(8px);
  
  border: 1px solid var(--color-border);
  padding: 2.2rem;
  border-radius: 16px;
  max-width: 600px;
  width: 100%;
    
  margin: 0 auto;

  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}


    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      padding: 0.7rem 1rem;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      font-family: 'Euclid', sans-serif;
      resize: vertical;
    }

    textarea {
      min-height: 120px;
    }

    input[type="submit"] {
      background-color: var(--color-accent);
      border: none;
      color: white;
      font-weight: 700;
      padding: 0.9rem 2rem;
      font-size: 1.1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      width: 100%;
    }

    input[type="submit"]:hover {
  background-color: var(--color-accent-hover);
    }

    .contact-info {
      margin-top: 2rem;
      max-width: 600px;
      text-align: center;
      font-size: 1.1rem;
      line-height: 1.4;
      color: var(--color-text-muted);
    }

    .contact-info a {
      color: #f0b47c;
      text-decoration: underline;
    }

    fieldset {
      margin: 2rem 0;
      padding: 1rem 1.2rem;
      border-radius: 12px;
      border: 1px solid var(--color-border);
    }

    legend {
      font-weight: 700;
      color: var(--color-accent);
      padding: 0 0.5rem;
    }


.formule-detail {
  display: block;
  font-size: 0.9rem;
  font-weight: 400;
  color: var(--color-text-muted);
  margin-top: 10px;
  margin-left: 1.75rem;
  line-height: 1.6;
}


  fieldset label {
  display: block;
  margin-bottom: 18px;
  line-height: 1.5;
}

fieldset label input[type="checkbox"] {
  margin-right: 10px;
}

.contact-container{
    width:100%;
    max-width:1200px;
    margin:80px auto;
    padding:0 8%;
}


.contact-container h2{
    text-align:left;
}


.contact-title{
    font-family:'Francois One',sans-serif;
    font-size:2.3rem;
    color:#fff;
    text-align:left;
    margin:0 0 24px;
}

    
.section-label{
    display:block;

    font-family:'Euclid', sans-serif;
    font-size:13px;
    font-weight:500;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#D7A84A;

    padding-bottom:22px;
    margin-bottom:22px;

    border-bottom:1px solid rgba(215,168,74,.35);

    max-width:620px;
}
  /* ================================
   📋 FORMULAIRE – CONFORT MOBILE
================================ */

/* Conteneur formulaire */
form {
  display: flex;
  flex-direction: column;
  gap: 1.4rem; /* espace entre chaque champ */
}

/* Labels */
form label {
  font-size: 0.95rem;
  margin-bottom: 0.3rem;
}

/* Champs */
form input,
form select,
form textarea {
  padding: 0.9rem 1rem;
  font-size: 1rem;
  border-radius: 12px;
}

/* Zone message */
form textarea {
  min-height: 160px;
}

/* Bouton */
form input[type="submit"] {
  margin-top: 1.5rem;
  padding: 1rem;
  font-size: 1.05rem;
}

  /* Inputs – thème sombre cohérent */
form input,
form select,
form textarea {
  background: rgba(255,255,255,0.08);
  color: var(--color-text-main);
  border: 1px solid var(--color-border);
}

form input::placeholder,
form textarea::placeholder {
  color: var(--color-text-muted);
}

/* Focus */
form input:focus,
form select:focus,
form textarea:focus {
  outline: none;
  border-color: var(--color-accent);
}


/* ======================
GALERIE CONTACT
====================== */

.contact-grid{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:80px;
}

.contact-left{
    flex:1;
    max-width:620px;
}

.contact-gallery{
    display:flex;
    flex-direction:column;
    gap:24px;
    position:sticky;
    top:120px;
    width:360px;
}
    
.contact-gallery img{

    width:100%;

    display:block;

    object-fit:cover;

    border-radius:14px;

}

.contact-gallery img:first-child{

    height:300px;

}

.contact-gallery img:last-child{

    width:82%;

    height:220px;

    margin-left:auto;

}

    
    /* ======================
   RESPONSIVE NAVBAR MOBILE
====================== */

@media (max-width: 768px) {

  .navbar {
    height: 80px;
  }

  body {
    padding-top: 80px;
  }

  .navbar-logo img {
    height: 52px;
  }

}


/* Mobile */
@media (max-width: 768px) {
  form {
    padding: 1.2rem;
  }

    }


  
/* HERO ABOUT */
    
.about-hero{
    position:relative;
    width:100vw;
    margin-left:calc(50% - 50vw);
    height:72vh;
    overflow:hidden;
}
    
    .about-hero video{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    object-fit:cover;

    object-position:75% center;

    transform:scale(1.08);

    filter:blur(4px) brightness(.65);

}
.about-overlay{

    position:absolute;

    inset:0;

    background:linear-gradient(

        to bottom,

        rgba(0,0,0,.12),

        rgba(0,0,0,.25)

    );

}
.about-content{
    position:relative;
    z-index:2;
    width:100%;
    max-width:900px;
    height:100%;
    margin:0;
    padding:0 11%;
    display:flex;
    flex-direction:column;
    justify-content:center;
  
}

   .about-content h1{

    font-family:'Francois One',sans-serif;

    font-size:clamp(2rem,4vw,4.1rem);

     white-space: nowrap;

    line-height:1.05;

    font-weight:400;

    max-width:none;

    color:#fff;

    text-align:left;

    margin:0 0 24px;
     
}
    
.about-intro{
    max-width:620px;
    font-size:1.3rem;
    line-height:1.6;
    color:#fff;
    text-align:left;
    margin:0 0 3rem;
}
    

</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">

    <!-- Logo -->
    <a href="/" class="navbar-logo">
      <img src="/assets/images/logo-cf.png" alt="Cora Flores">
    </a>

    <!-- Texte promo caché -->
    <div class="navbar-info" style="display:none;"></div>

   
    <!-- Liens / Boutons à droite -->
<div class="navbar-links">
  <a href="/apropos/">À propos</a>

   <a href="/point-de-depart/">Le Point de Départ</a>

  <a href="/#bascule">La Bascule</a>
  
  <a href="/contact/" class="cta active">Contact</a>
</div>

      </div>
</nav>



<header class="about-hero">
  <video autoplay muted loop playsinline>
<source src="/assets/videos/vecteezy_woman-using-smartphone-on-the-table_2015128.mp4" type="video/mp4">
</video>
<div class="about-overlay">
  
</div>
<div class="about-content">



  <h1>Parlons de votre projet.</h1>

<p class="about-intro">
Une question, une idée, un besoin précis…<br>ou simplement envie d'échanger ?<br>
Écrivez-moi. On en parle. 
</p>
  
</div>
</header>


<div class="contact-container">

  
  <div class="contact-grid">
    
     <div class="contact-left">

<p class="section-label">CONTACT</p>

<h2 class="contact-title">
    À vous de jouer.
</h2>
  
    
  <form method="POST" action="https://formspree.io/f/mqebrzwk">   <!-- site qui gere le formulaire -->
    <input type="hidden" name="site" value="Cora Flores"> <!-- formspress compte email cora.flores13@gmail.com -->
    <label for="name">Nom complet *</label>
    <input type="text" id="name" name="name" required placeholder="Votre nom complet" />

    <label for="email">Adresse e-mail *</label>
    <input type="email" id="email" name="_replyto" required placeholder="exemple@domaine.com" />

    <label for="phone">Téléphone</label>
    <input type="tel" id="phone" name="phone" placeholder="+33 6 12 34 56 78" />

  <label for="profil">Vous êtes… *</label>

<select id="profil" name="profil" required>
  <option value="" disabled selected>Choisissez une option</option>

  <option value="independant-freelance">
    Indépendant(e) / Freelance
  </option>

  <option value="entrepreneur">
    Entrepreneur(e)
  </option>

  <option value="dirigeant-petite-entreprise">
    Dirigeant(e) d'une petite entreprise
  </option>

  <option value="lancement-activite">
    En train de lancer mon activité
  </option>

  <option value="autre">
    Autre
  </option>
</select>

  
<fieldset>
  <legend>De quoi avez-vous besoin ? *</legend>

  <label>
    <input type="checkbox" name="besoin" value="Point de Départ" />
    Faire le Point de Départ
    <span class="formule-detail">
      Prendre du recul, faire le tri et identifier ce qui mérite votre attention.
    </span>
  </label>

  <label>
    <input type="checkbox" name="besoin" value="La Bascule" />
    Débloquer une situation avec La Bascule
    <span class="formule-detail">
  Faire avancer les sujets qui comptent et passer à l'action.
    </span>
  </label>

  <label>
    <input type="checkbox" name="besoin" value="Mission ponctuelle" />
    Un coup de main sur un sujet précis
    <span class="formule-detail">
      Pour une mission ponctuelle, à un moment précis.
    </span>
  </label>

  <label>
    <input type="checkbox" name="besoin" value="Je ne sais pas encore" />
    Je ne sais pas encore vraiment

  </label>

</fieldset>

    <label for="message">Dites-m'en un peu plus</label>
    <textarea id="message" name="message" placeholder="Quelques lignes suffisent. Expliquez-moi où vous en êtes, ce que vous avez en tête ou ce qui vous amène ici."></textarea>

    <input type="submit" value="Envoyer" />

    
  </form>

       </div> <!-- FIN contact-left -->

  <div class="contact-gallery">

    <img src="/assets/images/contact1.jpg" alt="contact1>

    <img src="/assets/images/contact11.jpg" alt="contact11">

</div>

</div>


<script>
document.addEventListener("DOMContentLoaded", function () {

  const form = document.querySelector('form[action*="formspree"]');
  const checkboxes = document.querySelectorAll('input[name="besoin"]');

  form.addEventListener("submit", function (event) {

    const auMoinsUneCaseCochee = Array.from(checkboxes).some(
      checkbox => checkbox.checked
    );

    if (!auMoinsUneCaseCochee) {
      event.preventDefault();

      alert("Merci de sélectionner au moins une option dans « De quoi avez-vous besoin ? ».");
    }

  });

});
</script>

  
  
</body>
